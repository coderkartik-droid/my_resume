name: Linux Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/build.db

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/build.db
          JWT_SECRET: build-only-placeholder-not-for-production

      - name: Prepare standalone package
        run: |
          mkdir -p .next/standalone/.next/static
          cp -a .next/static/. .next/standalone/.next/static/
          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi

      - name: Create deployment ZIP
        run: |
          cd .next/standalone
          zip -qr ../../deployment-linux.zip .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: marakata-linux-production
          path: deployment-linux.zip
          retention-days: 7
